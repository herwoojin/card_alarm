# 실적ON — Netlify 배포 설정
# Next.js 정적 내보내기(output: 'export') → out/ 를 그대로 서빙(정적).
# 보안 헤더는 public/_headers → out/_headers 로 복사되어 적용된다.
# 추가로, 문자 자동 수집용 무료 웹훅(Netlify Function)을 함께 배포한다.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
